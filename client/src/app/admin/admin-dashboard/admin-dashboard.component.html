<div class="container mt-5">
  <h2 class="text-center mb-4">Admin Dashboard</h2>

  <div class="row justify-content-center">
    <div class="col-md-6 mb-4">
      <div class="card text-center">
        <div class="card-body">
          <i class="fas fa-calendar-plus fa-3x mb-3 text-primary"></i>
          <h5 class="card-title">Create Event</h5>
          <p class="card-text">Create a new event for the community.</p>
          <a routerLink="/admin/create-event" class="btn btn-primary">Go to Create Event</a>
        </div>
      </div>
    </div>
    <div class="col-md-6 mb-4">
      <div class="card text-center">
        <div class="card-body">
          <i class="fas fa-users-cog fa-3x mb-3 text-secondary"></i>
          <h5 class="card-title">Manage Users</h5>
          <p class="card-text">Manage user roles and permissions.</p>
          <a routerLink="/admin/user-management" class="btn btn-secondary">Go to User Management</a>
        </div>
      </div>
    </div>
  </div>

  <div class="row mt-5">
    <div class="col-12">
      <h3 class="text-center mb-4">Manage Events</h3>
      <div class="event-list">
        <div class="event-card card mb-4" *ngFor="let event of events">
          <div class="card-body">
            <h5 class="event-title card-title">{{ event.title }}</h5>
            <img class="event-photo card-img-top mb-3" [src]="event.photoUrl" alt="{{ event.title }}">
            <p class="event-description card-text">{{ event.description }}</p>
            <button class="event-button btn btn-danger" (click)="deleteEvent(event.id)">
              <i class="fas fa-trash"></i> Delete
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="row mt-5">
    <div class="col-12">
      <h3 class="text-center mb-4">Manage Comments</h3>
      <div class="comment-list">
        <div class="comment-card card mb-4" *ngFor="let comment of comments">
          <div class="card-body">
            <p class="comment-content card-text">{{ comment.content }}</p>
            <small class="comment-date">{{ comment.date | date }}</small>
            <button class="comment-button btn btn-warning" (click)="markCommentAsSeen(comment.id)">
              <i class="fas fa-check"></i> Mark as Done
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="page">
  <div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">
      <div class="card card-elevated text-center p-4 p-md-5">
        <div class="card-body">
          <i class="fas fa-exclamation-triangle fa-3x text-warning mb-3" aria-hidden="true"></i>
          <h1 class="page-title">Something went wrong</h1>
          <p class="page-subtitle mb-4">We hit a problem on our side. Please try again in a moment.</p>
          <button type="button" class="btn btn-primary" routerLink="/">
            <i class="fas fa-home" aria-hidden="true"></i> Back to home
          </button>

          @if (showDetails && error) {
            <div class="text-start mt-4">
              <p class="fw-bold text-danger mb-2">Error: {{ error.message }}</p>
              <pre class="bg-light p-3 rounded small mb-0" style="white-space: pre-wrap;">{{ error.details }}</pre>
            </div>
          }
        </div>
      </div>
    </div>
  </div>
</div>

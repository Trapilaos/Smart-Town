name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (build and test)
    runs-on: ubuntu-latest
    env:
      TokenKey: ci-only-signing-key-ci-only-signing-key-ci-only-signing-key-0123456789abcdef
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore SmartTown.sln

      - name: Build
        run: dotnet build SmartTown.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test SmartTown.sln --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-results
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore

  client:
    name: Client (build and test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npx ng build --configuration production

      - name: Test (headless Chrome)
        run: npx ng test --watch=false --browsers=ChromeHeadlessCI

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [api, client]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: API/Dockerfile
          push: false
          tags: smart-town-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build client image
        uses: docker/build-push-action@v6
        with:
          context: client
          file: client/Dockerfile
          push: false
          tags: smart-town-client:ci
          cache-from: type=gha,scope=client
          cache-to: type=gha,scope=client,mode=max

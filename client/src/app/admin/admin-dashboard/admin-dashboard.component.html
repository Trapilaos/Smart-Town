<div class="container mt-5">
  <h2 class="text-center mb-4">Admin Dashboard</h2>

  <div class="row justify-content-center">
    <div class="col-md-6 mb-4">
      <div class="card text-center">
        <div class="card-body">
          <i class="fas fa-calendar-plus fa-3x mb-3 text-primary"></i>
          <h5 class="card-title">Create Event</h5>
          <p class="card-text">Create a new event for the community.</p>
          <a routerLink="/admin/create-event" class="btn btn-primary">Go to Create Event</a>
        </div>
      </div>
    </div>
    <div class="col-md-6 mb-4">
      <div class="card text-center">
        <div class="card-body">
          <i class="fas fa-users-cog fa-3x mb-3 text-secondary"></i>
          <h5 class="card-title">Manage Users</h5>
          <p class="card-text">Manage user roles and permissions.</p>
          <a routerLink="/admin/user-management" class="btn btn-secondary">Go to User Management</a>
        </div>
      </div>
    </div>
  </div>
</div>
